[workspace]
name = "personal_assistant"
version = "0.1.0"
description = "C4作业：多平台鞋类推荐多Agent系统（由conda environment.yml迁移）"
channels = ["conda-forge"]
# osx-arm64: Apple Silicon Mac；linux-64: 实验室服务器。
# 原environment.yml来自linux-64服务器，含nvidia-*/triton等CUDA包，这些在macOS上不存在，
# 此处交给PyPI按平台自动选择（Linux上torch会自带CUDA依赖，macOS上为CPU/MPS版）。
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# conda侧只放解释器。不要加pip：conda-forge的pip会连带拉入新版packaging(>=25)，
# 与langchain-core 0.3.68要求的packaging<25冲突。pixi用uv安装PyPI包，不需要pip。
python = "3.10.*"
# 显式钉住packaging，与原environment.yml一致，避免被conda侧解析成更高版本
packaging = "24.2.*"

[pypi-dependencies]
# ---- LLM / Agent 框架（版本与原environment.yml一致）----
langchain = "==0.3.26"
langchain-core = "==0.3.68"
langchain-community = "==0.3.27"
langchain-chroma = "==0.2.4"
langchain-deepseek = "==0.1.3"
langchain-huggingface = "==0.3.0"
langchain-openai = "==0.3.27"
langchain-text-splitters = "==0.3.8"
openai = "==1.93.3"

# ---- 向量库 / 嵌入模型 ----
chromadb = "==1.0.15"
sentence-transformers = "==5.0.0"
transformers = "==4.53.1"
huggingface-hub = "==0.33.2"
torch = "==2.7.1"
accelerate = "==1.8.1"
safetensors = "==0.5.3"
tokenizers = "==0.21.2"

# ---- 数值 / 数据处理 ----
numpy = "==2.2.6"
pandas = "==2.3.1"
scipy = "==1.15.3"
scikit-learn = "==1.7.0"

# ---- 其他 ----
python-dotenv = "==1.1.1"
tiktoken = "==0.9.0"
requests = "==2.32.4"
pyyaml = "==6.0.2"
tqdm = "==4.67.1"

[tasks]
# 运行主程序前需先设置环境变量：export api_key="你的DeepSeek密钥"
chat = { cmd = "python chat2.py", cwd = "." }
# 快速自检：确认所有核心依赖可导入
check = { cmd = "python -c \"import torch, chromadb, langchain, langchain_chroma, langchain_deepseek, langchain_huggingface, sentence_transformers, sklearn, pandas; print('torch', torch.__version__); print('chromadb', chromadb.__version__); print('langchain', langchain.__version__); print('OK')\"", cwd = "." }
